services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: splitlab
      POSTGRES_PASSWORD: splitlab-dev-only
      POSTGRES_DB: splitlab
    ports:
      # Change the host port if something else already uses 5432: SPLITLAB_PG_PORT=5433 docker compose up -d
      - "${SPLITLAB_PG_PORT:-5432}:5432"
    volumes:
      - splitlab-pg:/var/lib/postgresql/data

volumes:
  splitlab-pg:
